{% extends "layout.html" %}
{% block title %}{{ 'Editar' if produto else 'Novo' }} Produto{% endblock %}
{% block main %}
<form method="post">
    <div class="mb-3">
        <input class="form-control" name="nome" placeholder="Nome" value="{{ produto.name if produto }}">
    </div>
    <div class="mb-3">
        <textarea class="form-control" name="descricao"
            placeholder="Descrição">{{ produto.description if produto }}</textarea>
    </div>
    <div class="mb-3">
        <input class="form-control" name="preco" placeholder="Preço" type="number" step="0.01"
            value="{{ produto.price if produto }}">
    </div>
    <div class="mb-3">
        <input class="form-control" name="estoque" placeholder="Estoque" type="number"
            value="{{ produto.stock if produto }}">
    </div>
    <div class="mb-3">
        <label>Categorias</label>
        <div>
            {% for categoria in categorias %}
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="categorias" id="cat{{ categoria.id }}"
                    value="{{ categoria.id }}" {% if categoria.id|string in selecionadas %}checked{% endif %}>
                <label class="form-check-label" for="cat{{ categoria.id }}">{{ categoria.name }}</label>
            </div>
            {% endfor %}
        </div>
        <small class="form-text text-muted">Marque as categorias do produto</small>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a href="{{ url_for('produtos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
