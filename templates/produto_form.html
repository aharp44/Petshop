{% extends "layout.html" %}
{% block title %}{{ 'Editar' if produto else 'Novo' }} Produto{% endblock %}
{% block main %}
<form method="post">
    <div class="mb-3">
        <input class="form-control" name="nome" placeholder="Nome" value="{{ produto.name if produto }}">
    </div>
    <div class="mb-3">
        <textarea class="form-control" name="descricao" placeholder="Descrição">{{ produto.description if produto }}</textarea>
    </div>
    <div class="mb-3">
        <input class="form-control" name="preco" placeholder="Preço" type="number" step="0.01" value="{{ produto.price if produto }}">
    </div>
    <div class="mb-3">
        <input class="form-control" name="estoque" placeholder="Estoque" type="number" value="{{ produto.stock if produto }}">
    </div>
    <div class="mb-3">
        <label>Categorias</label>
        <select class="form-control" name="categorias" multiple>
            {% for categoria in categorias %}
                <option value="{{ categoria.id }}" {% if categoria.id|string in selecionadas %}selected{% endif %}>{{ categoria.name }}</option>
            {% endfor %}
        </select>
        <small class="form-text text-muted">Segure Ctrl para selecionar várias categorias</small>
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a href="{{ url_for('produtos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
