{% extends "layout.html" %}
{% block title %}{{ 'Editar' if funcionario else 'Novo' }} Funcionário{% endblock %}
{% block main %}
<form method="post">
    <div class="mb-3">
        <input class="form-control" name="nome" placeholder="Nome" value="{{ funcionario.name if funcionario }}">
    </div>
    <div class="mb-3">
        <input class="form-control" name="cargo" placeholder="Cargo" value="{{ funcionario.role if funcionario }}">
    </div>
    <div class="mb-3">
        <input class="form-control" name="data_contratacao" placeholder="Data de Contratação" type="date" value="{{ funcionario.hire_date if funcionario }}">
    </div>
    <div class="mb-3">
        <input class="form-control" name="salario" placeholder="Salário" type="number" step="0.01" value="{{ funcionario.salary if funcionario }}">
    </div>
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a href="{{ url_for('funcionarios') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
